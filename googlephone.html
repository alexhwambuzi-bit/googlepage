<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Home</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <header class="topbar">
    <a href="#" class="top-link">Mail</a>
    <a href="#" class="top-link">Images</a>

    <a href="#">:::</a>

    <a href="#" class="signin-btn">Sign in</a>
  </header>


  <main class="main">

    <h1 class="logo">Google</h1>

    <form class="search-box" role="search">
      <button type="button" class="icon-btn" aria-label="Add">
        +
      </button>

      <input type="text" class="search-input" aria-label="Search">

      <button type="button" class="icon-btn" aria-label="Voice search">
        🎙️
      </button>

      <button type="button" class="icon-btn" aria-label="Search by image">
        📷
      </button>

      <button type="button" class="ai-mode">
        🔍
        <span>AI Mode</span>
      </button>
    </form>

    <div class="buttons">
      <button class="btn">Search</button>
      <button class="btn">I'm Feeling Lucky</button>
    </div>

    <p class="languages">
      Google offered in:
      <a href="#">Luganda</a>
      <a href="#">Kiswahili</a>
      <a href="#">Ikinyarwanda</a>
      <a href="#">Luo</a>
      <a href="#">Runyakitara</a>
    </p>
  </main>

  
  <footer class="footer">
    <div class="country">Uganda</div>
    <nav class="footer-links">
      <div class="row">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="row">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </nav>
  </footer>

</body>

</html>
