<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <header class="top-bar">
    <div class="top-right">
      <a href="#">Gmail</a>
      <a href="#">Ebifaananyi</a>
      <div class="apps-icon">:::</div>
      <div class="profile">A</div>
    </div>
  </header>

  
  <main class="main">
    <h1 class="logo">Google</h1>

    <div class="search-box">
      <input type="text" class="search-input">
      <span class="icons">
        <span>⌨️</span>
        <span>📷</span>
      </span>
    </div>

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm feeling lucky</button>
    </div>

    <p class="languages">
      Google offered in: 
      <a href="#">Luganda</a>
      <a href="#">English</a> 
      <a href="#">Kiswahili</a> 
      <a href="#">Ikinyarwanda</a> 
      <a href="#">Luo</a> 
      <a href="#">Runyakitara</a>
    </p>
  </main>


  <footer class="footer">
    <div class="footer-top">Uganda</div>
    <div class="footer-bottom">
      <div class="footer-left">
        <a href="#">About</a>
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      
      <div class="footer-right">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Okweroboza</a>
      </div>
    </div>
  </footer>

</body>
</html>
